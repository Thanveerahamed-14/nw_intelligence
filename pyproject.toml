[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "network-intelligence-platform"
version = "1.0.0"
description = "Telecom Network Intelligence Platform for Role-Based AI Agents"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Telecom Network Intelligence Engineering Team" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.0.0",
    "networkx>=3.2",
    "httpx>=0.27.0",
    "python-dateutil>=2.8.2",
    "jinja2>=3.1.2",
    "rich>=13.7.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]
