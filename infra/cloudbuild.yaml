# Google Cloud Build CI/CD Deployment Pipeline
steps:
  # 1. Run Python Unit & Integration Tests
  - name: 'python:3.12-slim'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        pip install -r requirements.txt
        python scripts/run_tests.py

  # 2. Build Container Image with Cloud Run Entrypoint
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/network-intelligence-platform:$COMMIT_SHA', '.']

  # 3. Push Image to Google Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/network-intelligence-platform:$COMMIT_SHA']

  # 4. Deploy to Serverless Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'network-intelligence-platform'
      - '--image'
      - 'gcr.io/$PROJECT_ID/network-intelligence-platform:$COMMIT_SHA'
      - '--region'
      - 'europe-west1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

images:
  - 'gcr.io/$PROJECT_ID/network-intelligence-platform:$COMMIT_SHA'
